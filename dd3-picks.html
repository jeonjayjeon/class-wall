<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Digital Design3 8주차 수업 의견</title>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--good:#ffe27a;--want:#ffb8cb;--try:#a9dcff}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#151515;overflow:hidden}
  body{font-family:"Gothic A1",-apple-system,sans-serif;-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center}
  #board{position:relative;overflow:hidden;background:#f4f1ec radial-gradient(rgba(0,0,0,.05) 1px,transparent 1px) 0 0/22px 22px}
  .slot{position:absolute;transition:left .45s ease,top .45s ease}
  .note{width:var(--s);height:var(--s);padding:18px 16px 14px;border-radius:3px;cursor:grab;position:relative;
        background:linear-gradient(160deg,rgba(255,255,255,.35),rgba(255,255,255,0) 40%),var(--c);
        box-shadow:0 1px 1px rgba(0,0,0,.08),0 12px 22px -10px rgba(0,0,0,.28);
        display:flex;flex-direction:column;touch-action:none;user-select:none;-webkit-user-select:none}
  .note::before{content:"";position:absolute;top:-9px;left:50%;width:54px;height:18px;transform:translateX(-50%) rotate(-2deg);
        background:rgba(255,255,255,.55);box-shadow:0 1px 2px rgba(0,0,0,.06)}
  .note .k{font-size:10px;letter-spacing:.12em;opacity:.55;font-weight:700;margin-bottom:8px}
  .note .v{font-size:var(--fs);line-height:1.5;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:var(--lines);word-break:keep-all;overflow-wrap:anywhere;white-space:pre-wrap}
  .slot.drag{transition:none;z-index:9999!important;transform:rotate(0deg) scale(1.04)!important}
  .slot.drag .note{cursor:grabbing;box-shadow:0 4px 6px rgba(0,0,0,.08),0 30px 50px -14px rgba(0,0,0,.4)}
  #zoom{position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;background:rgba(20,20,20,.35);backdrop-filter:blur(3px)}
  #zoom.on{display:flex}
  #zoom .big{width:min(480px,86vw);min-height:min(480px,86vw);padding:36px 32px;border-radius:4px;box-shadow:0 30px 60px -20px rgba(0,0,0,.45)}
  #zoom .k{font-size:12px;letter-spacing:.12em;opacity:.55;font-weight:700;margin-bottom:16px}
  #zoom .v{font-size:21px;line-height:1.6;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
</style>
</head>
<body>
<div id="board"></div>
<div id="zoom"><div class="big"><div class="k"></div><div class="v"></div></div></div>
<script>
/* 시트에서 노란색으로 표시한 의견 (이름 제외) */
const ITEMS=[
 ['good','많은 ai와 명령어를 알수 있어서 좋았다'],
 ['good','Ai툴에 대해서 자세히 알려주셔서 너무 좋아요'],
 ['good','기획할 때 자유도가 높고 다양한 방식으로 피드백을 받을 수 있어서 좋았습니다!'],
 ['good','유쾌하면서 편안하고 재미있게 수업할 수 있었다 또 저번 학기때는 ai 프롬프트나 이런 사용법을 모른채 커리큘럼이 진행되어 아쉬운점이 있었는데 자세히 알려주셔서 좋앗슴'],
 ['want','앞으로 남은 수업에서 지금까지 배운 도구들을 손에 익혀 능수능란하게 사용하고싶다.'],
 ['good','교수님께서 피드백을 잘해주십니다'],
 ['tryIt','서로가 피드백하고 강평파은 현재의 수업 방식이 좋습니다 이 방향 그대로 부탁드립니다!'],
 ['good','에이아이 툴을 제대로 다뤄볼 수 있는 수업이 몇 없는데 못해본걸 해볼 수 있어서 좋았습니다.'],
 ['want','지금도 넘 만족스럽게 듣고 있어서 좋습니다. 교수님이 열정 넘치시고 재밌어서 수업이 즐거워요(과제는 가끔 힘들지만)'],
 ['tryIt','스토리를 넣어서 풀어내는 방식의 영상은 할줄 아는데 추상적이고 힙하거나 젠틀한 무드의 영상을 좀 어려워해서 그런 부분도 작업을 해보고 싶습니다.'],
 ['good','ai를 잘 활용하는 법을 알려주신것이 좋았습니다! 진짜 실무에서 활용할수있는것들을 알려주신것같아 도움이 많이되었어요'],
 ['good','ai 활용 방법을 자세하게 알려주셔서 원하는 이미지를 생성하기 위한 프롬폰트 작성에 도움이 되었습니당'],
 ['good','다양한 ai체험 및 학습의 기회가 됨'],
 ['good','Ai를 활용한 수업이 유익했고 평소에 관심있던 영상쪽을 심도있고 이해하기 쉽게 배울 수 있어서 좋았습니다'],
 ['good','교수님께서 설명해주시는 내용들이 학생들 눈높이에 맞는 것 같아 이해하기 쉬워 좋았고 여러 AI 프로그램을 소개해주셔서 앞으로 잘 사용할 것 같습니다!! 그리고 수업이 재미있어요'],
 ['want','지금같은 수업 방식이 쭉 이어지면 너무 좋을 것 같습니다 ㅎㅎ'],
 ['good','그동안 어려워서 다루지 못했던 Ai를 프롬프트는 어떻게 쓰는지, 이미지나 영상은 어떻게 만들어지는지 등의 구체적인 사용법을 배울 수 있어서 좋았다.'],
 ['want','없는 것 같다. 이 수업 방식 그대로 계속 진행되었으면 좋겠다.'],
 ['good','After effect나 AI 영상툴을 어떻게 다뤄야하는지 구체적으로 설명해주셔서 따로 영상을 찾아보지않아도 비교적 처음인데도 쓰기 쉽게 느껴졌다.'],
 ['tryIt','지금까지 가르쳐주셨던 것들 토대로 내가 하고 싶은 방향으로 영상을 끝까지 작업해보고 싶다.'],
 ['good','ai를 사용하는 수업이 없는데 처음으로 ai를 많이 사용하는 수업이라 신기하기도 하고 재미있어요!'],
 ['good','AI 활용으로 영상 제작의 재미를 찾고 다양한 작품을 보며 많이 배울수 있었습니다!! 특히 피드백 덕분에 작업 방향을 잡고 완성도를 높이는 데 큰 도움이 되었습니다.']
];
const KIND={good:{label:'좋았던 점',c:'var(--good)'},want:{label:'원하는 점',c:'var(--want)'},tryIt:{label:'시도하고 싶은 점',c:'var(--try)'}};
const $=id=>document.getElementById(id), board=$('board');
const NOTES=ITEMS.map(([k,t],i)=>({key:'n'+i, kind:KIND[k], text:t}));

function rng(str){ let h=1779033703^str.length; for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19;}
  return ()=>{h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return ((h^=h>>>16)>>>0)/4294967296;}; }

/* 순서 저장 (이 브라우저) */
const OKEY='picksOrder:'+location.pathname;
let order=NOTES.map(n=>n.key);
try{ const s=JSON.parse(localStorage.getItem(OKEY)||'null'); if(Array.isArray(s)&&s.length===order.length&&s.every(k=>order.includes(k))) order=s; }catch(e){}
function saveOrder(){ try{ localStorage.setItem(OKEY,JSON.stringify(order)); }catch(e){} }

let G=null, justDragged=false;
function layout(){
  const vw=innerWidth, vh=innerHeight, W=Math.min(vw,vh*1.5), H=W/1.5;
  board.style.width=W+'px'; board.style.height=H+'px';
  const pad=W*.012, aw=W-2*pad, ah=H-2*pad, N=order.length;
  const r0=Math.max(1,Math.min(N,Math.round(Math.sqrt(N*ah/aw*1.1)))), cols=Math.ceil(N/r0), rows=Math.ceil(N/cols);
  const cw=aw/cols, ch=ah/rows, s=Math.max(120,Math.min(400,Math.max(cw,ch)*1.02));
  G={cols,rows,aw,ch,pad,N};
  order.forEach((key,i)=>{
    const n=NOTES.find(x=>x.key===key), R=rng('pick'+key), c=i%cols, r=Math.floor(i/cols), nr=(r<rows-1?cols:N-cols*(rows-1)), cwr=aw/nr;
    const x=pad+c*cwr+(cwr-s)/2+(R()-.5)*cwr*0.3, y=pad+r*ch+(ch-s)/2+(R()-.5)*ch*0.3, rot=(R()-.5)*10;
    let el=board.querySelector('.slot[data-key="'+key+'"]');
    if(!el){ el=document.createElement('div'); el.className='slot'; el.dataset.key=key;
      el.innerHTML='<div class="note"><div class="k"></div><div class="v"></div></div>';
      const note=el.firstChild; note.querySelector('.k').textContent=n.kind.label; note.querySelector('.v').textContent=n.text;
      note.style.setProperty('--c',n.kind.c); note.onclick=()=>{ if(!justDragged) zoom(n); };
      board.appendChild(el); dragify(el,note); }
    if(!el.classList.contains('drag')){ el.style.left=Math.max(-s*.04,Math.min(W-s*.96,x))+'px'; el.style.top=Math.max(-s*.04,Math.min(H-s*.96,y))+'px'; }
    el.style.transform='rotate('+rot.toFixed(2)+'deg)'; el.style.zIndex=1+i;
    const note=el.firstChild, fs=Math.round(Math.min(18,Math.max(12,s/21)));
    note.style.setProperty('--s',s.toFixed(0)+'px'); note.style.setProperty('--fs',fs+'px');
    note.style.setProperty('--lines',Math.max(4,Math.floor((s-52)/(fs*1.5))));
  });
}
function slotAt(px,py){ const r=Math.max(0,Math.min(G.rows-1,Math.floor((py-G.pad)/G.ch))), nr=(r<G.rows-1?G.cols:G.N-G.cols*(G.rows-1));
  const c=Math.max(0,Math.min(nr-1,Math.floor((px-G.pad)/(G.aw/nr)))); return Math.max(0,Math.min(G.N-1,r*G.cols+c)); }

/* 끌어서 놓으면 그 자리 스티커와 서로 자리 바꾸기 */
function dragify(el,note){
  let sx=0,sy=0,ox=0,oy=0,on=false,id=null,snap=null,tgt=-1;
  note.addEventListener('pointerdown',e=>{ if(e.button>0) return; id=e.pointerId; sx=e.clientX; sy=e.clientY;
    ox=sx-el.offsetLeft; oy=sy-el.offsetTop; on=false; note.setPointerCapture(id); });
  note.addEventListener('pointermove',e=>{ if(e.pointerId!==id) return;
    if(!on){ if(Math.hypot(e.clientX-sx,e.clientY-sy)<6) return; on=true; el.classList.add('drag'); snap=order.slice(); tgt=snap.indexOf(el.dataset.key); }
    el.style.left=(e.clientX-ox)+'px'; el.style.top=(e.clientY-oy)+'px';
    const w=note.offsetWidth, idx=slotAt(e.clientX-ox+w/2, e.clientY-oy+w/2);
    if(idx!==tgt){ tgt=idx; const key=el.dataset.key, o=snap.slice(), i=o.indexOf(key), other=o[idx];
      if(other&&other!==key){ o[i]=other; o[idx]=key; } order=o; layout(); } });
  const end=e=>{ if(e.pointerId!==id) return; id=null; if(!on) return; on=false; justDragged=true; setTimeout(()=>justDragged=false,80);
    el.classList.remove('drag'); saveOrder(); layout(); };
  note.addEventListener('pointerup',end); note.addEventListener('pointercancel',end);
}
function zoom(n){ const z=$('zoom'), b=z.querySelector('.big'); b.style.background=n.kind.c;
  b.querySelector('.k').textContent=n.kind.label; b.querySelector('.v').textContent=n.text; z.classList.add('on'); }
$('zoom').onclick=()=>$('zoom').classList.remove('on');
addEventListener('keydown',e=>{ if(e.key==='f'||e.key==='F'){ document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen(); }
  if(e.key==='r'||e.key==='R'){ order=NOTES.map(n=>n.key); saveOrder(); layout(); } });
let rt; addEventListener('resize',()=>{ clearTimeout(rt); rt=setTimeout(layout,150); });
document.fonts.ready.then(layout);
</script>
</body>
</html>
