<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Digital Design3 8주차 수업 의견</title>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--good:#ffe27a;--want:#ffb8cb;--try:#a9dcff}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#151515;overflow:hidden}
  body{font-family:"Gothic A1",-apple-system,sans-serif;-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;cursor:none}
  #board{position:relative;background:#f4f1ec radial-gradient(rgba(0,0,0,.05) 1px,transparent 1px) 0 0/22px 22px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.45)}
  .st{position:absolute;transform-origin:50% 50%;opacity:0}
  .note{width:100%;height:100%;border-radius:3px;position:relative;
        padding:12% 10% 9%;display:flex;flex-direction:column;
        background:linear-gradient(160deg,rgba(255,255,255,.35),rgba(255,255,255,0) 40%),var(--c);
        box-shadow:0 1px 1px rgba(0,0,0,.08),0 12px 22px -10px rgba(0,0,0,.28)}
  .note::before{content:"";position:absolute;top:-5%;left:50%;width:34%;height:10%;transform:translateX(-50%) rotate(-2deg);
        background:rgba(255,255,255,.55);box-shadow:0 1px 2px rgba(0,0,0,.06)}
  .note .k{font-weight:700;letter-spacing:.12em;opacity:.55;margin-bottom:.7em}
  .note .v{line-height:1.5;word-break:keep-all;overflow-wrap:anywhere;color:#111;font-weight:500}
  .st.focus .note{box-shadow:0 2px 3px rgba(0,0,0,.1),0 40px 70px -24px rgba(0,0,0,.45)}
  #dim{position:absolute;inset:0;background:rgba(244,241,236,.72);opacity:0;pointer-events:none;transition:opacity .8s ease;z-index:500}
  #dim.on{opacity:1}
</style>
</head>
<body>
<div id="board"><div id="dim"></div></div>
<script>
/* 시트에서 노란색으로 표시한 의견 (이름 제외) */
const ITEMS=[
 ['good','많은 ai와 명령어를 알수 있어서 좋았다'],
 ['good','Ai툴에 대해서 자세히 알려주셔서 너무 좋아요'],
 ['good','기획할 때 자유도가 높고 다양한 방식으로 피드백을 받을 수 있어서 좋았습니다!'],
 ['good','유쾌하면서 편안하고 재미있게 수업할 수 있었다 또 저번 학기때는 ai 프롬프트나 이런 사용법을 모른채 커리큘럼이 진행되어 아쉬운점이 있었는데 자세히 알려주셔서 좋앗슴'],
 ['want','앞으로 남은 수업에서 지금까지 배운 도구들을 손에 익혀 능수능란하게 사용하고싶다.'],
 ['good','교수님께서 피드백을 잘해주십니다'],
 ['tryIt','서로가 피드백하고 강평파은 현재의 수업 방식이 좋습니다 이 방향 그대로 부탁드립니다!'],
 ['good','에이아이 툴을 제대로 다뤄볼 수 있는 수업이 몇 없는데 못해본걸 해볼 수 있어서 좋았습니다.'],
 ['want','지금도 넘 만족스럽게 듣고 있어서 좋습니다. 교수님이 열정 넘치시고 재밌어서 수업이 즐거워요(과제는 가끔 힘들지만)'],
 ['tryIt','스토리를 넣어서 풀어내는 방식의 영상은 할줄 아는데 추상적이고 힙하거나 젠틀한 무드의 영상을 좀 어려워해서 그런 부분도 작업을 해보고 싶습니다.'],
 ['good','ai를 잘 활용하는 법을 알려주신것이 좋았습니다! 진짜 실무에서 활용할수있는것들을 알려주신것같아 도움이 많이되었어요'],
 ['good','ai 활용 방법을 자세하게 알려주셔서 원하는 이미지를 생성하기 위한 프롬폰트 작성에 도움이 되었습니당'],
 ['good','다양한 ai체험 및 학습의 기회가 됨'],
 ['good','Ai를 활용한 수업이 유익했고 평소에 관심있던 영상쪽을 심도있고 이해하기 쉽게 배울 수 있어서 좋았습니다'],
 ['good','교수님께서 설명해주시는 내용들이 학생들 눈높이에 맞는 것 같아 이해하기 쉬워 좋았고 여러 AI 프로그램을 소개해주셔서 앞으로 잘 사용할 것 같습니다!! 그리고 수업이 재미있어요'],
 ['want','지금같은 수업 방식이 쭉 이어지면 너무 좋을 것 같습니다 ㅎㅎ'],
 ['good','그동안 어려워서 다루지 못했던 Ai를 프롬프트는 어떻게 쓰는지, 이미지나 영상은 어떻게 만들어지는지 등의 구체적인 사용법을 배울 수 있어서 좋았다.'],
 ['want','없는 것 같다. 이 수업 방식 그대로 계속 진행되었으면 좋겠다.'],
 ['good','After effect나 AI 영상툴을 어떻게 다뤄야하는지 구체적으로 설명해주셔서 따로 영상을 찾아보지않아도 비교적 처음인데도 쓰기 쉽게 느껴졌다.'],
 ['tryIt','지금까지 가르쳐주셨던 것들 토대로 내가 하고 싶은 방향으로 영상을 끝까지 작업해보고 싶다.'],
 ['good','ai를 사용하는 수업이 없는데 처음으로 ai를 많이 사용하는 수업이라 신기하기도 하고 재미있어요!'],
 ['good','AI 활용으로 영상 제작의 재미를 찾고 다양한 작품을 보며 많이 배울수 있었습니다!! 특히 피드백 덕분에 작업 방향을 잡고 완성도를 높이는 데 큰 도움이 되었습니다.']
];
const KIND={good:['좋았던 점','var(--good)'],want:['원하는 점','var(--want)'],tryIt:['시도하고 싶은 점','var(--try)']};
const T_IN=1000, T_HOLD=3000, T_OUT=1000, T_FINAL=6000;

const board=document.getElementById('board'), dim=document.getElementById('dim');
let W=0,H=0,els=[],slots=[];

function rng(seed){ let s=seed*9301+49297; return ()=>{ s=(s*9301+49297)%233280; return s/233280; }; }

function size(){
  const vw=innerWidth, vh=innerHeight, m=Math.min(vw,vh)*0.04;
  W=Math.min(vw-2*m,(vh-2*m)*1.5); H=W/1.5;
  board.style.width=W+'px'; board.style.height=H+'px';
  // 6 x 4 격자, 마지막 줄은 가운데 정렬
  const N=ITEMS.length, cols=6, rows=Math.ceil(N/cols), cw=W/cols, ch=H/rows, s=Math.min(cw,ch)*1.06, R=rng(7);
  slots=ITEMS.map((_,i)=>{ const r=Math.floor(i/cols), c=i%cols, nr=(r<rows-1?cols:N-cols*(rows-1)), cwr=W/nr;
    const x=c*cwr+(cwr-s)/2+(R()-.5)*cwr*.22, y=r*ch+(ch-s)/2+(R()-.5)*ch*.22;
    return {x:Math.max(W*.005,Math.min(W-s*1.01,x)), y:Math.max(H*.02,Math.min(H-s*1.02,y)), s, rot:(R()-.5)*12}; });
  els.forEach((el,i)=>place(el,i));
}
function place(el,i){ const p=slots[i]; el.style.left=p.x+'px'; el.style.top=p.y+'px'; el.style.width=p.s+'px'; el.style.height=p.s+'px';
  const len=ITEMS[i][1].length, f=len<25?.095:len<55?.075:len<90?.062:.052;
  el.querySelector('.v').style.fontSize=(p.s*f)+'px'; el.querySelector('.k').style.fontSize=(p.s*.045)+'px'; }
function focusTf(i){ const p=slots[i], fs=H*.66, k=fs/p.s, cx=W/2-(p.x+p.s/2), cy=H/2-(p.y+p.s/2);
  return {cx,cy,k}; }

function build(){
  ITEMS.forEach(([k,t],i)=>{ const el=document.createElement('div'); el.className='st';
    el.innerHTML='<div class="note"><div class="k"></div><div class="v"></div></div>';
    el.querySelector('.k').textContent=KIND[k][0]; el.querySelector('.v').textContent=t;
    el.querySelector('.note').style.setProperty('--c',KIND[k][1]);
    board.appendChild(el); els.push(el); });
  size();
}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
let paused=false; async function hold(ms){ const end=Date.now()+ms; while(Date.now()<end || paused) await wait(50); }

async function show(i){
  const el=els[i], p=slots[i], {cx,cy,k}=focusTf(i);
  const focus=`translate(${cx}px,${cy}px) scale(${k}) rotate(-1deg)`;
  el.classList.add('focus'); el.style.zIndex=1000; dim.classList.add('on');
  // 1. 붙는 애니메이션 1초
  await el.animate([
    {opacity:0, transform:`translate(${cx}px,${cy-H*.35}px) scale(${k*1.25}) rotate(-14deg)`},
    {opacity:1, offset:.55, transform:`translate(${cx}px,${cy+H*.012}px) scale(${k*.985}) rotate(1.5deg)`},
    {opacity:1, transform:focus}
  ],{duration:T_IN,easing:'cubic-bezier(.2,.9,.3,1)',fill:'forwards'}).finished;
  // 2. 3초간 보기
  const sway=el.animate([{transform:focus},{transform:`translate(${cx}px,${cy-H*.004}px) scale(${k}) rotate(.6deg)`},{transform:focus}],
    {duration:T_HOLD,easing:'ease-in-out'});
  await hold(T_HOLD); sway.cancel();
  // 3. 전환 1초: 대지 위 자리로
  dim.classList.remove('on');
  await el.animate([{opacity:1,transform:focus},{opacity:1,transform:`translate(0,0) scale(1) rotate(${p.rot}deg)`}],
    {duration:T_OUT,easing:'cubic-bezier(.6,0,.25,1)',fill:'forwards'}).finished;
  el.classList.remove('focus'); el.style.zIndex=10+i;
}
async function run(){
  while(true){
    for(let i=0;i<els.length;i++) await show(i);
    await hold(T_FINAL);
    await Promise.all(els.map((el,i)=>el.animate([{opacity:1},{opacity:0}],{duration:900,delay:i*25,fill:'forwards'}).finished));
    els.forEach(el=>{ el.getAnimations().forEach(a=>a.cancel()); el.style.opacity=''; el.style.transform=''; });
    await wait(500);
  }
}
addEventListener('resize',()=>{ size(); els.forEach((el,i)=>{ const a=el.getAnimations(); if(!el.classList.contains('focus')&&a.length){ a.forEach(x=>x.cancel()); el.style.opacity=1; el.style.transform=`rotate(${slots[i].rot}deg)`; } }); });
addEventListener('keydown',e=>{ if(e.code==='Space'){ paused=!paused; e.preventDefault(); } if(e.key==='f'||e.key==='F'){ document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen(); } });
document.fonts.ready.then(()=>{ build(); run(); });
</script>
</body>
</html>
