<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Digital Design3 8주차 수업 의견</title>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--good:#ffe27a;--want:#ffb8cb;--try:#a9dcff}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#151515;overflow:hidden}
  body{font-family:"Gothic A1",-apple-system,sans-serif;-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;cursor:none}
  #board{position:relative;background:#f4f1ec radial-gradient(rgba(0,0,0,.05) 1px,transparent 1px) 0 0/22px 22px;overflow:hidden}
  .st{position:absolute;transform-origin:50% 0;opacity:0;will-change:transform}
  .note{width:100%;height:100%;border-radius:3px;position:relative;
        padding:9% 8% 7%;display:flex;flex-direction:column;
        background:linear-gradient(160deg,rgba(255,255,255,.35),rgba(255,255,255,0) 40%),var(--c);
        box-shadow:0 1px 1px rgba(0,0,0,.08),0 18px 30px -14px rgba(0,0,0,.35)}
  .note::before{content:"";position:absolute;top:-14px;left:50%;width:30%;height:28px;transform:translateX(-50%) rotate(-2deg);
        background:rgba(255,255,255,.55);box-shadow:0 1px 2px rgba(0,0,0,.06)}
  .note .k{font-weight:700;letter-spacing:.12em;opacity:.55;margin-bottom:.8em}
  .note .v{line-height:1.5;word-break:keep-all;overflow-wrap:anywhere;color:#111;font-weight:500}
</style>
</head>
<body>
<div id="board"></div>
<script>
/* 시트에서 노란색으로 표시한 의견 (이름 제외) */
const ITEMS=[
 ['good','많은 ai와 명령어를 알수 있어서 좋았다'],
 ['good','Ai툴에 대해서 자세히 알려주셔서 너무 좋아요'],
 ['good','기획할 때 자유도가 높고 다양한 방식으로 피드백을 받을 수 있어서 좋았습니다!'],
 ['good','유쾌하면서 편안하고 재미있게 수업할 수 있었다 또 저번 학기때는 ai 프롬프트나 이런 사용법을 모른채 커리큘럼이 진행되어 아쉬운점이 있었는데 자세히 알려주셔서 좋앗슴'],
 ['want','앞으로 남은 수업에서 지금까지 배운 도구들을 손에 익혀 능수능란하게 사용하고싶다.'],
 ['good','교수님께서 피드백을 잘해주십니다'],
 ['tryIt','서로가 피드백하고 강평파은 현재의 수업 방식이 좋습니다 이 방향 그대로 부탁드립니다!'],
 ['good','에이아이 툴을 제대로 다뤄볼 수 있는 수업이 몇 없는데 못해본걸 해볼 수 있어서 좋았습니다.'],
 ['want','지금도 넘 만족스럽게 듣고 있어서 좋습니다. 교수님이 열정 넘치시고 재밌어서 수업이 즐거워요(과제는 가끔 힘들지만)'],
 ['tryIt','스토리를 넣어서 풀어내는 방식의 영상은 할줄 아는데 추상적이고 힙하거나 젠틀한 무드의 영상을 좀 어려워해서 그런 부분도 작업을 해보고 싶습니다.'],
 ['good','ai를 잘 활용하는 법을 알려주신것이 좋았습니다! 진짜 실무에서 활용할수있는것들을 알려주신것같아 도움이 많이되었어요'],
 ['good','ai 활용 방법을 자세하게 알려주셔서 원하는 이미지를 생성하기 위한 프롬폰트 작성에 도움이 되었습니당'],
 ['good','다양한 ai체험 및 학습의 기회가 됨'],
 ['good','Ai를 활용한 수업이 유익했고 평소에 관심있던 영상쪽을 심도있고 이해하기 쉽게 배울 수 있어서 좋았습니다'],
 ['good','교수님께서 설명해주시는 내용들이 학생들 눈높이에 맞는 것 같아 이해하기 쉬워 좋았고 여러 AI 프로그램을 소개해주셔서 앞으로 잘 사용할 것 같습니다!! 그리고 수업이 재미있어요'],
 ['want','지금같은 수업 방식이 쭉 이어지면 너무 좋을 것 같습니다 ㅎㅎ'],
 ['good','그동안 어려워서 다루지 못했던 Ai를 프롬프트는 어떻게 쓰는지, 이미지나 영상은 어떻게 만들어지는지 등의 구체적인 사용법을 배울 수 있어서 좋았다.'],
 ['want','없는 것 같다. 이 수업 방식 그대로 계속 진행되었으면 좋겠다.'],
 ['good','After effect나 AI 영상툴을 어떻게 다뤄야하는지 구체적으로 설명해주셔서 따로 영상을 찾아보지않아도 비교적 처음인데도 쓰기 쉽게 느껴졌다.'],
 ['tryIt','지금까지 가르쳐주셨던 것들 토대로 내가 하고 싶은 방향으로 영상을 끝까지 작업해보고 싶다.'],
 ['good','ai를 사용하는 수업이 없는데 처음으로 ai를 많이 사용하는 수업이라 신기하기도 하고 재미있어요!'],
 ['good','AI 활용으로 영상 제작의 재미를 찾고 다양한 작품을 보며 많이 배울수 있었습니다!! 특히 피드백 덕분에 작업 방향을 잡고 완성도를 높이는 데 큰 도움이 되었습니다.']
];
const KIND={good:['좋았던 점','var(--good)'],want:['원하는 점','var(--want)'],tryIt:['시도하고 싶은 점','var(--try)']};
const T_IN=1000, T_HOLD=3000, T_OUT=1000;
const BATCHES=[8,7,7];   // 한 번에 붙는 장수

const board=document.getElementById('board');
let W=0,H=0,paused=false;
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function hold(ms){ const end=Date.now()+ms; while(Date.now()<end||paused) await wait(50); }
const rnd=(a,b)=>a+Math.random()*(b-a);

function size(){
  const vw=innerWidth, vh=innerHeight;
  W=Math.min(vw,vh*1.5); H=W/1.5;
  board.style.width=W+'px'; board.style.height=H+'px';
}
// 장수에 맞춰 대지 전체를 덮는 배치 (가장자리는 대지 밖으로 살짝 넘침)
function slotsFor(n){
  const rows=2, perRow=[Math.ceil(n/2), Math.floor(n/2)], ch=H/rows, out=[];
  perRow.forEach((cnt,r)=>{ const cw=W/cnt;
    for(let c=0;c<cnt;c++){ const w=cw*1.1, h=ch*1.12;
      out.push({x:c*cw-(w-cw)/2+rnd(-.03,.03)*cw, y:(r===0? -ch*.01+rnd(0,.02)*ch : ch*.95+rnd(-.02,.02)*ch), w, h, rot:rnd(-4,4)}); } });
  return out;
}
function make(item,p){
  const [k,t]=item, el=document.createElement('div'); el.className='st';
  el.innerHTML='<div class="note"><div class="k"></div><div class="v"></div></div>';
  el.querySelector('.k').textContent=KIND[k][0]; el.querySelector('.v').textContent=t;
  el.querySelector('.note').style.setProperty('--c',KIND[k][1]);
  Object.assign(el.style,{left:p.x+'px',top:p.y+'px',width:p.w+'px',height:p.h+'px'});
  const base=Math.min(p.w,p.h), len=t.length, f=len<25?.105:len<55?.085:len<90?.07:.06;
  el.querySelector('.v').style.fontSize=(base*f)+'px'; el.querySelector('.k').style.fontSize=Math.max(11,base*.042)+'px';
  board.appendChild(el); return el;
}
function fit(el){ // 글이 넘치면 글자를 줄여 맞춤
  const n=el.querySelector('.note'), v=el.querySelector('.v');
  let fs=parseFloat(v.style.fontSize);
  while(v.offsetTop+v.scrollHeight>n.clientHeight*.93 && fs>10){ fs-=1; v.style.fontSize=fs+'px'; }
}

async function batch(items){
  const P=slotsFor(items.length);
  const order=items.map((_,i)=>i).sort(()=>Math.random()-.5);   // 붙는 순서·겹침 순서 무작위
  const els=items.map((it,i)=>{ const el=make(it,P[i]); fit(el); return el; });
  // 1. 우다다 붙기 (1초 안에)
  const step=(T_IN-560)/Math.max(1,items.length-1);
  await Promise.all(order.map((i,j)=>{ const el=els[i], p=P[i]; el.style.zIndex=10+j;
    return el.animate([
      {opacity:0, transform:`translate(${rnd(-40,40)}px,-${H*.12}px) scale(1.18) rotate(${p.rot+rnd(-14,14)}deg)`},
      {opacity:1, offset:.6, transform:`translate(0,4px) scale(.99) rotate(${p.rot+rnd(-1,1)}deg)`},
      {opacity:1, transform:`translate(0,0) scale(1) rotate(${p.rot}deg)`}
    ],{duration:560,delay:j*step,easing:'cubic-bezier(.2,.9,.3,1)',fill:'forwards'}).finished; }));
  // 2. 3초 보기 (살짝 흔들림)
  const sw=els.map((el,i)=>el.animate([{transform:`rotate(${P[i].rot}deg)`},{transform:`rotate(${P[i].rot+rnd(-.8,.8)}deg) translateY(-2px)`},{transform:`rotate(${P[i].rot}deg)`}],
    {duration:T_HOLD,easing:'ease-in-out',composite:'replace'}));
  await hold(T_HOLD); sw.forEach(a=>a.cancel());
  // 3. 떨어져 사라지기 (1초)
  const fstep=(T_OUT-650)/Math.max(1,items.length-1);
  await Promise.all(order.slice().reverse().map((i,j)=>els[i].animate([
      {opacity:1, transform:`translate(0,0) rotate(${P[i].rot}deg)`},
      {opacity:1, offset:.25, transform:`translate(0,-8px) rotate(${P[i].rot+rnd(-3,3)}deg)`},
      {opacity:0, transform:`translate(${rnd(-60,60)}px,${H*.9}px) rotate(${P[i].rot+rnd(-35,35)}deg)`}
    ],{duration:650,delay:j*fstep,easing:'cubic-bezier(.5,0,.8,.4)',fill:'forwards'}).finished));
  els.forEach(el=>el.remove());
}
async function run(){
  while(true){ let at=0;
    for(const n of BATCHES){ await batch(ITEMS.slice(at,at+n)); at+=n; }
  }
}
addEventListener('resize',size);
addEventListener('keydown',e=>{ if(e.code==='Space'){ paused=!paused; e.preventDefault(); } if(e.key==='f'||e.key==='F'){ document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen(); } });
size(); document.fonts.ready.then(run);
</script>
</body>
</html>
